name: Offline Tool Dispatcher

on:
  pull_request:
    paths:
      - "tools/offline_tool_dispatcher.py"
      - "tests/test_offline_tool_dispatcher.py"
      - ".github/workflows/offline-tools.yml"
      - "pyproject.toml"
      - "requirements-ci.txt"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "tools/offline_tool_dispatcher.py"
      - "tests/test_offline_tool_dispatcher.py"
      - ".github/workflows/offline-tools.yml"
      - "pyproject.toml"
      - "requirements-ci.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tools-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-dispatcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - name: Install project test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Compile dispatcher
        run: python -m py_compile tools/offline_tool_dispatcher.py
      - name: Run dispatcher security tests
        run: python -m pytest -q tests/test_offline_tool_dispatcher.py
