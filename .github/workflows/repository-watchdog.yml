name: Repository Watchdog

on:
  push:
    branches:
      - main
      - Claude
      - GPT/Codex
      - ara-hardened
      - copilot/main
      - Collaboration
      - Grok
      - duckAI
      - devassist420
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watch:
    name: Repository Watchdog (visible)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js 25
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '25'
          check-latest: true

      - name: Install pinned YAML validator
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Verify runner and Node.js runtime contract
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA="${GITHUB_SHA}"
          test "${#SHA}" -eq 40
          echo "WATCHDOG_EVENT=${GITHUB_EVENT_NAME}"
          echo "WATCHDOG_RUN_ID=${GITHUB_RUN_ID}"
          echo "FULL_SHA=${SHA}"
          echo 'RUNNER_CONTRACT=PASS'
          NODE_MAJOR="$(node -p 'Number(process.versions.node.split(".")[0])')"
          if (( NODE_MAJOR < 25 )); then
            echo "NODE_RUNTIME=FAIL expected >=25, got $(node --version)" >&2
            exit 1
          fi
          echo "NODE_RUNTIME=PASS $(node --version)"

      - name: Verify workflow files and required runner declarations
        shell: bash
        run: |
          set -Eeuo pipefail
          required=(.github/workflows/validate.yml .github/workflows/SCAR.yml .github/workflows/repository-watchdog.yml)
          for workflow in "${required[@]}"; do
            [[ -f "$workflow" ]] || { echo "WATCHDOG=FAIL missing $workflow" >&2; exit 1; }
            python - "$workflow" <<'PY'
          import pathlib, sys, yaml
          path = pathlib.Path(sys.argv[1])
          try:
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"invalid YAML {path}: {exc}")
          if not isinstance(data, dict) or not isinstance(data.get("jobs"), dict) or not data["jobs"]:
              raise SystemExit(f"missing jobs mapping: {path}")
          for name, job in data["jobs"].items():
              if not isinstance(job, dict) or not job.get("runs-on"):
                  raise SystemExit(f"missing runs-on for job {name}: {path}")
          print(f"WORKFLOW_CONTRACT=PASS {path}")
          PY
          done
          echo 'WATCHDOG_RESULT=PASS'
