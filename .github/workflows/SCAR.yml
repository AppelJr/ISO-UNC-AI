name: SCAR — Sovereign Compliance Audit Record

on:
  push:
    branches:
      - main
      - '**'
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for this SCAR attestation run
        required: false
        default: manual-attest
      force_key_rotation:
        description: Explicit compromise only; does not rotate keys automatically
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: scar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scar-contract:
    name: SCAR — Independent Compliance Attestation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'

      - name: SCAR source gate
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f scripts/scar_pqc_attest.py ]]; then
            python -m py_compile scripts/scar_pqc_attest.py
            echo 'SCAR_SOURCE_GATE=PASS'
          else
            echo 'SCAR_SOURCE_GATE=FAIL (required scripts/scar_pqc_attest.py missing)' >&2
            exit 1
          fi

      - name: Validate SCAR hash chain
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          candidates = (pathlib.Path("scar"), pathlib.Path("SCAR"),
                        pathlib.Path("evidence/scar"), pathlib.Path("logs/scar"))
          directories = [p for p in candidates if p.is_dir()]
          if len(directories) != 1:
              sys.exit(f"SCAR_CHAIN=FAIL expected exactly one SCAR directory, found {len(directories)}")
          records = sorted(directories[0].rglob("*.json"))
          if not records:
              sys.exit("SCAR_CHAIN=FAIL no JSON records found")
          previous = None
          for index, path in enumerate(records):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  sys.exit(f"SCAR_CHAIN=FAIL malformed record {path}: {exc}")
              if not isinstance(data, dict):
                  sys.exit(f"SCAR_CHAIN=FAIL record is not an object: {path}")
              if index == 0:
                  if data.get("hash_prev") not in (None, ""):
                      sys.exit(f"SCAR_CHAIN=FAIL first record has unexpected predecessor: {path}")
              elif data.get("hash_prev") != previous:
                  sys.exit(f"SCAR_CHAIN=FAIL predecessor mismatch: {path}")
              declared = data.get("record_hash")
              if not isinstance(declared, str) or len(declared) != 64:
                  sys.exit(f"SCAR_CHAIN=FAIL missing SHA-256 record_hash: {path}")
              unhashed = dict(data)
              unhashed.pop("record_hash", None)
              canonical = json.dumps(unhashed, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
              actual = hashlib.sha256(canonical).hexdigest()
              if declared != actual:
                  sys.exit(f"SCAR_CHAIN=FAIL record hash mismatch: {path}")
              previous = declared
          print(f"SCAR_CHAIN=PASS records={len(records)}")
          PY

      - name: Record attestation metadata
        shell: bash
        env:
          SCAR_REASON: ${{ inputs.reason || 'push-attest' }}
          SCAR_ROTATION_REQUESTED: ${{ inputs.force_key_rotation || 'false' }}
        run: |
          set -Eeuo pipefail
          printf 'SCAR_RESULT=PASS\n'
          printf 'SCAR_COMMIT=%s\n' "${GITHUB_SHA}"
          printf 'SCAR_RUN_ID=%s\n' "${GITHUB_RUN_ID}"
          printf 'SCAR_EVENT=%s\n' "${GITHUB_EVENT_NAME}"
          printf 'SCAR_REASON=%s\n' "${SCAR_REASON}"
          printf 'SCAR_KEY_ROTATION_REQUESTED=%s\n' "${SCAR_ROTATION_REQUESTED}"
          echo 'NOTE=This verifies repository checks, not external hardware attestation or immutable storage.'
