# validator_logic.yaml — AI System Validator Module Stack
# ISO-UNC-AI Protocol

version: "1.0"
protocol: ISO-UNC-AI-2026

modules:
  - name: core_tests
    description: Baseline functional verification
    required: true
    order: 1

  - name: extended_tests
    description: Edge cases, stress, and failure-mode coverage
    required: true
    order: 2
    depends_on: [core_tests]

  - name: hardware_attestation
    description: Device identity and integrity proof
    required: true
    order: 3
    depends_on: [extended_tests]

  - name: threat_feed
    description: Live CVE and vulnerability cross-reference
    required: true
    order: 4
    depends_on: [hardware_attestation]

  - name: signature_update_vest
    description: Cryptographic signature freshness check
    required: true
    order: 5
    depends_on: [threat_feed]

fail_closed: true
all_failures_halt: true

outputs:
  - validated
  - rejected
  - pending_review
