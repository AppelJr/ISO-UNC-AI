name: ISO-UNC-AI Validate

on:
  push:
    branches: [main, audit/full-compliance-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Python compile check
        run: python -m compileall -q .

      - name: Run full Python test suite
        run: python -m pytest -q tests

      - name: Lint Python security-critical files
        run: python -m flake8 --max-line-length=120 sys-validator.py tools/zero_tolerance_scan.py tests/test_sys_validator_security.py

      - name: Check Python static analysis errors
        run: python -m pylint --errors-only sys-validator.py tools/zero_tolerance_scan.py tests/test_sys_validator_security.py

      - name: Verify fail-closed rejection contract
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "sys-validator.py", "tests/fixtures/invalid-bundle.json"],
              capture_output=True,
              text=True,
              check=False,
          )
          if result.returncode != 1:
              raise SystemExit(
                  f"Expected rejection exit code 1, got {result.returncode}; "
                  f"stderr={result.stderr!r}"
              )
          if result.stderr:
              raise SystemExit(f"Unexpected stderr/traceback: {result.stderr}")
          try:
              report = json.loads(result.stdout)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Expected JSON rejection report: {exc}") from exc
          if report.get("result") != "rejected" or not report.get("reason"):
              raise SystemExit(f"Expected explicit rejection report, got {report!r}")
          print("FAIL-CLOSED CONTRACT: PASS")
          PY

      - name: Syntax check JavaScript
        run: node --check validator.js && node --check log-schema.js

      - name: Validate YAML logic
        run: python -c "import yaml; yaml.safe_load(open('validator_logic.yaml', encoding='utf-8'))"

      - name: Run repository security policy scan
        run: python tools/zero_tolerance_scan.py
