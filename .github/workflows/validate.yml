name: ISO-UNC-AI Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Python compile check
        run: python -m compileall -q .

      - name: Run contract tests
        run: python -m pytest -q tests/contracts

      - name: Verify fail-closed rejection path
        run: python sys-validator.py tests/fixtures/invalid-bundle.json

      - name: Syntax check JavaScript
        run: node --check validator.js && node --check log-schema.js

      - name: Validate YAML logic
        run: python -c "import yaml; yaml.safe_load(open('validator_logic.yaml', encoding='utf-8'))"

      - name: Scan prohibited placeholder/security patterns
        run: python tools/zero_tolerance_scan.py
