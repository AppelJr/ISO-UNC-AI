    body {

    #binary:focus {

      border-color: var(--primary);
    }
    .error {

      font-size: 0.9rem;
      margin-top: 0.5rem;
      display: none;
    }
    .error.show { display: block; }

    }

      background: var(--code-bg);
      padding: 1rem;
      border-radius: 8px;
      font-family: var(--font);
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .result-box:hover {
      background: #dee2e6;
    }

      content: "Click to copy";

      top: 8px;
      right: 12px;
      font-size: 0.75rem;
      color: #666;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .result-box:hover::after {
      opacity: 1;
