name: ISO-UNC-AI Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run system validator
        run: python sys-validator.py

      - name: Syntax check JavaScript
        run: node --check validator.js && node --check log-schema.js

      - name: Validate YAML logic
        run: python -c "import yaml; yaml.safe_load(open('validator_logic.yaml'))"
